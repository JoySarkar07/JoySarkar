<section id="skills" class="section skills">
  <div class="shell">
    <div class="section-head" appReveal>
      <span class="section-head__index">02.</span>
      <h2>What I work with</h2>
      <span class="section-head__rule" aria-hidden="true"></span>
    </div>

    <div class="skills__grid">
      @for (group of groups; track group.title; let g = $index) {
        <article
          class="pane"
          [class.pane--ai]="group.variant === 'ai'"
          [class.ai-frame]="group.variant === 'ai'"
          appReveal
          [appRevealDelay]="g * 110"
        >
          <h3 class="pane__title" [class.ai-text]="group.variant === 'ai'">
            @if (group.variant === 'ai') {
              <svg class="ai-spark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z" />
              </svg>
            } @else {
              <span class="pane__bar" aria-hidden="true"></span>
            }
            {{ group.title }}
          </h3>
          @if (group.note) {
            <p class="pane__note">{{ group.note }}</p>
          }
          <ul class="chips">
            @for (item of group.items; track item) {
              <li class="chip">{{ item }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
