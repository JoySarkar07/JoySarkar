<header class="bar" [class.bar--scrolled]="scrolled()">
  <div class="shell bar__inner">
    <a class="mark" href="#top" (click)="closeMenu()">
      <span class="mark__bracket">&lt;</span>
      <span class="mark__text">js</span>
      <span class="mark__bracket">/&gt;</span>
    </a>

    <nav class="nav" aria-label="Sections">
      <ul class="nav__list">
        @for (item of nav; track item.id; let i = $index) {
          <li>
            <a
              class="nav__link"
              [class.nav__link--active]="activeId() === item.id"
              [href]="'#' + item.id"
            >
              <span class="nav__num">0{{ i + 1 }}.</span>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      class="burger"
      type="button"
      [class.burger--open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

<!-- Mobile drawer -->
<div
  id="mobile-nav"
  class="drawer"
  [class.drawer--open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <nav aria-label="Sections">
    <ul class="drawer__list">
      @for (item of nav; track item.id; let i = $index) {
        <li class="drawer__item" [style.--i]="i">
          <a class="drawer__link" [href]="'#' + item.id" (click)="closeMenu()">
            <span class="nav__num">0{{ i + 1 }}.</span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
